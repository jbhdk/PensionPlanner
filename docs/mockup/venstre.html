<!doctype html>
<html lang="da">
<head>

<link rel="stylesheet" href="venstre.css">
</head>
<body>

<div class="kappe">
  <b>Venstre spalte</b>
  <span class="note">Fire strukturer, samme plan, samme udtryk (4a · Aften). Kun venstre side skifter.</span>
  <nav>
    <button data-m="a" onclick="saetModel('a')">A · Harmonika</button>
    <button data-m="b" onclick="saetModel('b')">B · Navigator</button>
    <button data-m="c" onclick="saetModel('c')">C · Dokument</button>
    <button data-m="d" onclick="saetModel('d')">D · Tidslinje</button>
  </nav>
</div>

<div class="app">
  <div class="topbjaelke">
    <span class="maerke">Pensionsplanner</span>
    <select><option>Ophør som 58</option><option>Ophør som 55</option></select>
    <span class="hoejre">Gemt <button class="knap">Eksporter</button> <button class="knap">Importer</button></span>
  </div>
  <div class="spalter" id="spalter"></div>
</div>

<script src="plan.js"></script>
<script src="venstre.js"></script>
